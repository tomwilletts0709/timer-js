<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1 initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="timer-container" id="timer">
        <div class="timer-ring">
            <svg class="progress-ring" width="300" height="300">
            <circle class="progess-ring__background" cx="150" cy="150" r="140"></circle>
            <circle class="progess-ring__circle" cx="150" cy="150" r="140"></circle>
            </svg>
            <div class="timer-display">
                <div class="timer-time" id="timerDisplay">25:00</div>
                    <div class="timer-label"></div>
                </div>
            </div>
    <button id="start-btn" class="btn start-btn" onclick="startTimer()">Start</button>
    <button id="end-btn" class="btn end-btn" onclick="stopTimer()">Stop</button>
    <button id="reset-btn" class="btn reset-btn" onclick="resetTimer">Reset</button>
    </div>
        </div>
    </div>
<div class="container">
<h1>Pomodoro Timer</h1>
<p>Press the timer and begin your study session.</p>
</div>
<script src=script.js></script>
</html>
